<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ApexCAD Studio - Precision B-Rep &amp; Silicon EDA</title>
    <meta name="description" content="ApexCAD Studio: High-precision B-Rep CAD and Silicon EDA engineering suite powered by NVIDIA usd-brep and accelerated geometry kernels." />
    <meta property="og:title" content="ApexCAD Studio - Precision B-Rep &amp; Silicon EDA" />
    <meta property="og:description" content="ApexCAD Studio: High-precision B-Rep CAD and Silicon EDA engineering suite powered by NVIDIA usd-brep and accelerated geometry kernels." />
    <script>
      // Early suppressor for benign ResizeObserver undelivered notifications in preview/test frames
      window.addEventListener('error', function (e) {
        if (
          e.message &&
          (e.message.indexOf('ResizeObserver loop completed') !== -1 ||
            e.message.indexOf('ResizeObserver loop limit') !== -1)
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.onerror = function (msg) {
        if (
          typeof msg === 'string' &&
          (msg.indexOf('ResizeObserver loop completed') !== -1 ||
            msg.indexOf('ResizeObserver loop limit') !== -1)
        ) {
          return true;
        }
      };
    </script>
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        theme: {
          extend: {
            spacing: {
              '88': '22rem',
              '92': '23rem',
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        background-color: #121316;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #181a20;
      }
      ::-webkit-scrollbar-thumb {
        background: #2c303b;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f4453;
      }
      /* Fallback width rules for custom extended spacing in case Tailwind CDN fails or delays */
      .hidden {
        display: none !important;
      }
      .w-0 {
        width: 0 !important;
      }
      .min-w-0 {
        min-width: 0 !important;
      }
      .max-w-0 {
        max-width: 0 !important;
      }
      .w-88 {
        width: 22rem;
      }
      .w-92 {
        width: 23rem;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
