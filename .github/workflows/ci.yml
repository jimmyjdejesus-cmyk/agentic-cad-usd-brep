name: ApexCAD Studio CI Matrix

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Automated Secret Auditing & Leak Prevention
  security-audit:
    name: Secret & Credential Leak Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan Tracked Files for Leaked API Keys & Secrets
        run: |
          python3 -c "
          import os, re, sys

          patterns = {
              'Google / Firebase API Key': re.compile(r'AIza[0-9A-Za-z-_]{35}'),
              'OpenAI API Key': re.compile(r'sk-[a-zA-Z0-9]{20,}'),
              'Anthropic API Key': re.compile(r'sk-ant-[a-zA-Z0-9]{20,}'),
              'Hugging Face Token': re.compile(r'hf_[a-zA-Z0-9]{20,}'),
              'GitHub Personal Token': re.compile(r'(?:ghp|gho|ghu|ghs|ghr|github_pat)_[a-zA-Z0-9_]{16,}'),
              'AWS Access Key': re.compile(r'AKIA[0-9A-Z]{16}'),
              'Private Key Block': re.compile(r'-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'),
          }

          tracked = [f.strip() for f in os.popen('git ls-files').readlines()]
          leaks = 0

          for fpath in tracked:
              if not os.path.isfile(fpath):
                  continue
              try:
                  with open(fpath, 'r', encoding='utf-8', errors='ignore') as f:
                      for idx, line in enumerate(f, 1):
                          for name, pat in patterns.items():
                              match = pat.search(line)
                              if match:
                                  print(f'::error file={fpath},line={idx}::Detected potential secret leak [{name}]: {match.group(0)[:8]}...')
                                  leaks += 1
              except Exception as e:
                  print(f'Error reading {fpath}: {e}', file=sys.stderr)

          if leaks > 0:
              print(f'FAILED: Found {leaks} exposed secret(s) in tracked git files!')
              sys.exit(1)
          else:
              print('PASSED: Clean git tree, zero exposed secrets detected.')
          "

  # Job 2: Frontend Linting, Unit Testing, and Production Build
  frontend-ci:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Analysis & Type Checking
        run: npm run lint

      - name: Run Vitest Unit Test Suite
        run: npm test

      - name: Run Production Bundle Build (Vite)
        run: npm run build

  # Job 3: Python FastAPI Engine & CAD Synthesizer Verification
  backend-ci:
    name: Python FastAPI Engine & Tests
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Pytest Engine Verification
        run: |
          pytest backend/test_cad_engine.py -v
