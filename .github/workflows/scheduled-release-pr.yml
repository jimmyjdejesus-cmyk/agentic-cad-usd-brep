name: Scheduled Release PR (Dev to Main)

on:
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'SemVer bump type (auto detects breaking/feature/fix)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    name: Prepare & Create Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Fetch origin/main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Check for pending commits on dev
        id: check_commits
        run: |
          AHEAD_COUNT=$(git rev-list --count origin/main..HEAD)
          echo "Commits on dev ahead of main: ${AHEAD_COUNT}"
          echo "ahead_count=${AHEAD_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Execute Version Bump & Changelog Generation
        if: steps.check_commits.outputs.ahead_count > 0
        id: bump_version
        run: |
          BUMP_MODE="${{ github.event.inputs.bump_type || 'auto' }}"
          echo "Running release bump mode: ${BUMP_MODE}"
          node scripts/release-manager.mjs bump "$BUMP_MODE"

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New Version: v${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit Version Bump to dev
        if: steps.check_commits.outputs.ahead_count > 0
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json CHANGELOG.md
          git commit -m "chore(release): bump version to v${{ steps.bump_version.outputs.version }}"
          git push origin dev

      - name: Generate Release PR Description Body
        if: steps.check_commits.outputs.ahead_count > 0
        run: |
          NEW_VER="${{ steps.bump_version.outputs.version }}"
          cat << 'EOF' > /tmp/release_pr_body.md
          ## 📦 Scheduled Production Release: vNEW_VERSION_PLACEHOLDER

          This pull request was automatically generated by the **Scheduled Release Workflow** to promote accumulated and verified changes from the `dev` branch into production `main`.

          ---

          ### 📋 Release Checklist & Quality Gates
          - [x] All feature and bugfix PRs merged into `dev`
          - [x] Version bumped in `package.json` to `vNEW_VERSION_PLACEHOLDER`
          - [x] `CHANGELOG.md` updated with grouped Conventional Commits
          - [x] 15+ Vitest suites passing (160+ unit tests, 100% pass rate)
          - [x] TypeScript static analysis verified (`tsc --noEmit`)
          - [x] Python FastAPI B-Rep engine verified (`pytest`)
          - [x] Production bundle verified (`vite build`)
          - [x] Clean tree with zero credential leaks verified

          ---

          ### 📝 Changelog Preview
          EOF

          sed -i "s/NEW_VERSION_PLACEHOLDER/${NEW_VER}/g" /tmp/release_pr_body.md
          node scripts/release-manager.mjs changelog auto >> /tmp/release_pr_body.md

          cat << 'EOF' >> /tmp/release_pr_body.md

          ---

          > [!NOTE]
          > Merging this pull request into `main` will automatically trigger the **Publish Release & Tag** workflow, creating Git tag `vNEW_VERSION_PLACEHOLDER` and a published GitHub Release.
          EOF
          sed -i "s/NEW_VERSION_PLACEHOLDER/${NEW_VER}/g" /tmp/release_pr_body.md

      - name: Create or Update Pull Request (dev -> main)
        if: steps.check_commits.outputs.ahead_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_VER="${{ steps.bump_version.outputs.version }}"
          EXISTING_PR=$(gh pr list --base main --head dev --state open --json number -q '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Found existing open release PR #${EXISTING_PR}. Updating title and description..."
            gh pr edit "$EXISTING_PR" --title "release: v${NEW_VER}" --body-file /tmp/release_pr_body.md
            echo "✅ Release PR #${EXISTING_PR} successfully updated."
          else
            echo "Opening new release PR from dev to main..."
            gh pr create \
              --base main \
              --head dev \
              --title "release: v${NEW_VER}" \
              --body-file /tmp/release_pr_body.md
            echo "✅ Release PR created successfully."
          fi

      - name: Log In-Sync Status
        if: steps.check_commits.outputs.ahead_count == 0
        run: |
          echo "::notice title=In Sync::The 'dev' branch has 0 pending commits ahead of 'main'. Skipping scheduled release PR."
